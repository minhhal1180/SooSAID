name: sos_aid_mobile
description: S.O.S Aid - ung dung ho tro so cap ngoai vien danh cho nguoi dan
publish_to: "none"

# version: <tên hiển thị>+<build number>
# Build number PHẢI tăng ở mỗi lần nộp TestFlight/App Store; CI tự tăng bằng
# --build-number (xem .github/workflows/mobile-ios.yml).
version: 0.1.0+1

environment:
  # Phải khớp với phần `sdks:` ở cuối pubspec.lock. Nếu khai báo ở đây lỏng hơn
  # lockfile, một SDK cũ hơn vẫn qua được `flutter pub get` nhưng pub sẽ âm thầm
  # GIẢI LẠI xuống các phiên bản cũ — và lỗi chỉ lộ ra ở bước phân tích dưới
  # dạng "tên X không tồn tại", rất khó truy ngược. Đã xảy ra thật ở CI.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Giao tiếp backend ---------------------------------------------------
  http: ^1.2.2

  # --- Lưu trữ cục bộ ------------------------------------------------------
  # Token đăng nhập: Keychain (iOS) / EncryptedSharedPreferences (Android).
  # Thay cho shared_preferences vì threat model yêu cầu secure storage cho
  # credential — điện thoại có thể mất hoặc bị người khác cầm.
  flutter_secure_storage: ^9.2.2
  # Nội dung hướng dẫn đã duyệt (không nhạy cảm) để xem offline (SOS-051).
  shared_preferences: ^2.3.3

  # --- Thiết bị ------------------------------------------------------------
  geolocator: ^13.0.2
  # Xin quyền camera/mic cho video call, có kiểm soát thời điểm hỏi.
  permission_handler: ^11.3.1
  # Gọi trực tiếp số cấp cứu khi mất mạng hoặc backend lỗi (TDD §12).
  url_launcher: ^6.3.1

  # --- Video (Rule 8.1 – luôn đi qua adapter) ------------------------------
  # SDK chỉ được import trong lib/core/video/livekit_video_adapter.dart.
  # Tối thiểu 2.13.0: `VideoViewFit` mới xuất hiện từ bản này. Để ^2.3.0 thì
  # một lần giải lại phụ thuộc có thể rơi xuống bản không có enum đó.
  livekit_client: ^2.13.0

  # Video sơ cứu đóng gói sẵn, phát trực tiếp từ Flutter assets nên không cần
  # mạng. 2.11.1 là bản mới nhất tương thích Dart 3.10 của dự án.
  video_player: ^2.11.1

  # --- Bản đồ (M07) --------------------------------------------------------
  # OpenStreetMap: không cần API key, phù hợp Pilot. Chỉ dùng trong
  # lib/core/map/osm_map_adapter.dart để đổi nhà cung cấp không phải sửa UI.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # --- Tiện ích ------------------------------------------------------------
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # MP4 H.264 dung lượng nhỏ, nằm trong binary/native app và được PWA chủ
    # động precache ở lần tải đầu tiên.
    - assets/offline_videos/call_115.mp4
    - assets/offline_videos/scene_safety.mp4
    - assets/offline_videos/observe_signs.mp4
    - assets/offline_videos/wait_for_support.mp4
