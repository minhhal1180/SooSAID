<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Bị thay bằng giá trị của `flutter build web --base-href`. Trên GitHub
       Pages trang nằm ở /SooSAID/, không phải gốc tên miền, nên KHÔNG được để
       trống — để trống thì mọi file .js/.wasm đều 404. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- `viewport-fit=cover` để nội dung tràn ra vùng tai thỏ khi chạy toàn màn
       hình; thiếu nó thì hai đầu màn hình có dải đen trên iPhone có notch. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description"
        content="S.O.S Aid – ứng dụng hỗ trợ sơ cấp ngoại viện. Kết nối người dân với tổng đài và hướng dẫn sơ cứu. Không thay thế tổng đài 115.">
  <meta name="theme-color" content="#D32F2F">

  <!-- Thêm vào màn hình chính trên iOS.
       Khai báo CẢ HAI: `mobile-web-app-capable` là chuẩn mới, còn Safari trên
       các bản iOS cũ hơn chỉ hiểu biến thể có tiền tố `apple-`. Thiếu cái sau
       thì app mở kèm thanh địa chỉ, không còn giống app native. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="S.O.S Aid">

  <!-- iOS lấy đúng ảnh 180x180 này làm icon màn hình chính. Không bo góc sẵn:
       iOS tự bo, bo hai lần sẽ trông như icon lỗi. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>S.O.S Aid</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #D32F2F;
    }

    /* Màn hình chờ trong lúc Flutter tải engine (vài giây ở lần mở đầu).
       Không có nó, người dùng nhìn nền trống và tưởng app hỏng. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #D32F2F;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 250ms ease-out;
      z-index: 9999;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }

    #splash .name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #splash .note {
      font-size: 13px;
      opacity: 0.85;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    #splash .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tôn trọng tuỳ chọn "giảm chuyển động" của hệ điều hành. */
    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">S.O.S Aid</div>
    <div class="spinner"></div>
    <div class="note">Đang tải. Trong trường hợp khẩn cấp, hãy gọi 115 ngay.</div>
  </div>

  <script>
    // Flutter phát sự kiện này khi đã vẽ xong khung hình đầu tiên. Gỡ splash
    // theo sự kiện đó thay vì theo hẹn giờ: máy chậm hay mạng yếu vẫn đúng.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
